name: Glory — Autonomous Research

on:
  schedule:
    - cron: '0 18 * * *'  # 2pm Eastern daily
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Firewall — validate environment
        env:
          VAULT_KEY: ${{ secrets.VAULT_KEY }}
        run: bash scripts/vault/firewall.sh

      - name: Vault — decrypt API key
        env:
          VAULT_KEY: ${{ secrets.VAULT_KEY }}
        run: |
          source scripts/vault/decrypt.sh
          echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> $GITHUB_ENV

      - name: Run research session
        run: |
          claude --print --dangerously-skip-permissions --add-dir "$GITHUB_WORKSPACE" "$(cat scripts/cloud-agent-prompt.md)"

      - name: Push research note
        run: git push origin main

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glory-hype"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=13.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "feedparser>=6.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

